<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="adrian/img/Soccer_ball.ico">

<title>Mi mejor amigo...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:Georgia, serif;
}

/* CONTENIDO */

.page-wrapper{
    position:relative;
    z-index:2;

    display:flex;
    justify-content:center;
    align-items:center;

    width:100%;
    height:100vh;
}

/* BOTÓN */

.btn-ver{
    border:none;

    background:white;
    color:black;

    font-family:Georgia, serif;
    font-size:1.15rem;

    padding:16px 56px;

    border-radius:999px;

    cursor:pointer;

    box-shadow:
        0 0 8px rgba(255,255,255,.9),
        0 0 20px rgba(255,255,255,.7),
        0 0 40px rgba(255,255,255,.4);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}

.btn-ver:hover{

    transform:scale(1.05);

    box-shadow:
        0 0 12px rgba(255,255,255,1),
        0 0 30px rgba(255,255,255,.8),
        0 0 60px rgba(255,255,255,.5);
}

/* TRANSICIÓN */

.magic-opening{
    animation:openMagic .9s ease forwards;
}

@keyframes openMagic{

    0%{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }

    100%{
        opacity:0;
        transform:scale(2);
        filter:blur(20px);
    }

}
</style>
</head>

<body>

    <div class="page-wrapper" id="wrapper">
        <button class="btn-ver" id="verBtn">Go</button>
    </div>

    <script>
    
    document.getElementById("verBtn").addEventListener("click", () => {
    
        const wrapper = document.getElementById("wrapper");
    
        wrapper.classList.add("magic-opening");
    
        setTimeout(() => {
            window.location.href = "/adrian";
        }, 900);
    
    });
    </script>

</body>
</html>
