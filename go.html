<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adrián</title>

<style>
*{
    box-sizing:border-box;
}

html,
body {
    overflow: hidden;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

.page-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    height:100vh;
}

.btn-ver{
    border:none;
    background:white;
    color:black;
    font-size:1.2rem;
    padding:14px 50px;
    border-radius:8px;
    cursor:pointer;
}

.magic-opening{
    animation: openMagic .9s ease forwards;
}

@keyframes openMagic{
    to{
        transform:scale(1.15);
        opacity:0;
        filter:blur(6px);
    }
}
</style>
</head>

<body>

<div class="page-wrapper" id="wrapper">
    <button class="btn-ver" id="verBtn">Ver</button>
</div>

<script>
document.getElementById("verBtn").addEventListener("click", () => {

    const wrapper = document.getElementById("wrapper");

    wrapper.classList.add("magic-opening");

    setTimeout(() => {
        window.location.href = "/adrian/adrian.html";
    }, 900);

});
</script>

</body>
</html>
