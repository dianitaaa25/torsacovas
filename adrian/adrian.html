<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="img/Soccer_ball.ico">

<title>Para Adrian</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.scene{
    position:relative;
    width:500px;
    height:500px;
    z-index:2;
}

#message{
    position:absolute;
    left:50%;
    top:180px;

    transform:translateX(-50%);

    color:white;
    font-size:32px;
    font-family:Georgia, serif;
    text-align:center;

    opacity:0;

    text-shadow:
        0 0 10px rgba(255,255,255,.4);

    pointer-events:none;
}

.show-message{
    animation:messageFade 3.5s ease;
}

@keyframes messageFade{

    0%{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(40px)
            scale(.8);
    }

    15%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

    75%{
        opacity:1;
        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translateX(-50%)
            translateY(-40px)
            scale(1.05);
    }
}

/* HALO */

.glow{
    position:absolute;
    left:50%;
    bottom:-25px;

    width:260px;
    height:120px;

    transform:translateX(-50%);

    background:
    radial-gradient(
        circle,
        rgba(230,235,255,.95) 0%,
        rgba(170,180,255,.75) 20%,
        rgba(100,120,255,.45) 50%,
        rgba(60,70,180,.20) 75%,
        transparent 100%
    );

    filter:blur(30px);

    animation:glowPulse 2.2s ease-in-out infinite;
}

/* REBOTE */

.ball-wrap{
    position:absolute;
    left:50%;
    bottom:0;

    transform:translateX(-50%);

    animation:bounce 2.2s ease-in-out infinite;
}

.ball-wrap-stopped{
    animation: none !important;
    transform: translateX(-50%) translateY(0) scaleX(1.12) scaleY(.85) !important;
}

/* ESFERA */

.ball{
    position:relative;

    width:170px;
    height:170px;

    border-radius:50%;

    overflow:hidden;

    animation:spin 12s linear infinite;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff 0%,
            #fafafa 30%,
            #ededed 55%,
            #c8c8c8 80%,
            #8a8a8a 100%
        );

    box-shadow:
        inset -20px -20px 30px rgba(0,0,0,.22),
        inset 12px 12px 20px rgba(255,255,255,.4),
        0 0 12px rgba(255,255,255,.08);
}

/* BRILLO */

.ball::before{

    content:"";

    position:absolute;

    top:18px;
    left:26px;

    width:55px;
    height:35px;

    border-radius:50%;

    background:white;

    opacity:.28;

    filter:blur(6px);

    z-index:3;
}

/* SVG */

.ball svg{
    position:absolute;
    width:108%;
    height:108%;
    left:-3%;
    top:-3%;
    z-index:2;
}

/* REBOTE */

@keyframes bounce{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0)
            scaleX(1.12)
            scaleY(.85);
    }

    10%{
        transform:
            translateX(-50%)
            translateY(-6px)
            scale(1);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-350px)
            scale(1);
    }

    90%{
        transform:
            translateX(-50%)
            translateY(-6px)
            scale(1);
    }
}

/* ROTACIÓN LENTA */

@keyframes spin{

    from{
        transform:
            rotate(-18deg);
    }

    to{
        transform:
            rotate(342deg);
    }
}

/* HALO DINÁMICO */

@keyframes glowPulse{

    0%,100%{

        transform:
            translateX(-50%)
            scaleX(.90)
            scaleY(.45);

        opacity:.95;
    }

    50%{

        transform:
            translateX(-50%)
            scaleX(2)
            scaleY(1);

        opacity:.35;
    }
}

/* ESTRELLAS */

#stars{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.star{
    position:absolute;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 4px rgba(255,255,255,.8),
        0 0 10px rgba(255,255,255,.6),
        0 0 20px rgba(255,255,255,.4);

    animation:twinkle linear infinite;
}

@keyframes twinkle{

    0%,100%{
        opacity:.15;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.4);
    }
}

/* DESTELLO DE AMOR */

.star-love{
    animation: loveGlow 3.5s ease forwards !important;
}

@keyframes loveGlow{

    0%{
        box-shadow:
            0 0 4px rgba(255,255,255,.8),
            0 0 10px rgba(255,255,255,.6),
            0 0 20px rgba(255,255,255,.4);
        transform: scale(1);
        opacity: 0.5;
    }

    35%{
        box-shadow:
            0 0 6px rgba(255,255,255, 1),
            0 0 15px rgba(200, 220, 255, 0.9),
            0 0 35px rgba(200, 220, 255, 0.6);
        
        transform: scale(1.6);
        opacity: 1;
    }

    100%{
        box-shadow:
            0 0 4px rgba(255,255,255,.8),
            0 0 10px rgba(255,255,255,.6),
            0 0 20px rgba(255,255,255,.4);
        transform: scale(1);
        opacity: 0.5;
    }
}

.ball-stopped{
    animation-play-state: paused !important;
}

.glow-stopped{
    animation: none !important;
    transform: translateX(-50%) scaleX(1.1) scaleY(.55) !important;
    opacity: 0.7 !important;
}

.ball-wrap-stopped{
    animation: none !important;
    transform: translateX(-50%) translateY(0) scaleX(1) scaleY(1) !important;
}

/* BOTONES OCULTOS */

.menu-btn{
    position: fixed;
    right: 40px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 4px rgba(255,255,255,.8),
        0 0 10px rgba(255,255,255,.6),
        0 0 20px rgba(255,255,255,.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
    z-index: 1000;
}

#btn-carta{
    top: 50px;
    cursor: pointer;
}

#btn-fotos{
    top: 90px;
    cursor: pointer;
}

.menu-btn.visible{
    opacity: 1;
    pointer-events: auto;
    z-index: 1000;
}

/* GALERÍA DE FOTOS */
#gallery{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    display: none;
}

#gallery.visible{
    display: block;
    pointer-events: auto;
}

.photo{
    position: absolute;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    box-shadow:
        0 0 8px rgba(255,255,255,.9),
        0 0 20px rgba(255,255,255,.6),
        0 0 40px rgba(255,255,255,.3);
    cursor: pointer;
    transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 51;
}

.photo:hover{
    box-shadow:
        0 0 12px rgba(255,255,255,1),
        0 0 30px rgba(255,255,255,.8),
        0 0 60px rgba(255,255,255,.5);
    z-index: 60;
}

/* FOTO ACTIVA (estilo PREZI) */
.photo.active{
    position: fixed;
    top: 50% !important;
    left: 50% !important;
    width: 80vmin !important;
    height: 80vmin !important;
    transform: translate(-50%, -50%) scale(1) !important;
    border-radius: 5%;
    box-shadow:
        0 0 30px rgba(255,255,255,1),
        0 0 60px rgba(255,255,255,.8),
        0 0 100px rgba(255,255,255,.5) !important;
    z-index: 100;
}

/* Animación de entrada */
@keyframes galleryZoomIn{
    0%{ transform: scale(0); opacity: 0; }
    70%{ transform: scale(1.1); opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
}

/* ZOOM DE REBOTE */
@keyframes galleryZoomIn{
    0%{
        transform: scale(0.3);
        opacity: 0;
    }
    60%{
        transform: scale(1.1);
        opacity: 1;
    }
    100%{
        transform: scale(1);
        opacity: 1;
    }
}

/* ZOOM DE PANTALLA COMPLETA */
body.gallery-open{
    animation: screenZoomOut 0.6s ease;
}

body.gallery-closed{
    animation: screenZoomIn 0.6s ease forwards;
}

@keyframes screenZoomOut{
    0%{
        transform: scale(1.2);
    }
    100%{
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes screenZoomIn{
    0%{
        transform: scale(1.2);
    }
    100%{
        transform: scale(1);
        opacity: 1;
    }
}

/* Ocultar scene durante galería */
.scene{
    transition: all 0.4s ease;
}

.scene.hidden{
    opacity: 0;
    transform: scale(0);
    pointer-events: none;
}
</style>
</head>

<script>

const messages = [
    "¿Te acuerdas?",
    "Extraño como era antes.",
    "Extraño el tiempo contigo.",
    "Perdón.",
    "Sigues siendo importante para mí.",
    "Te amo."
];

let current = 0;
let bounceCount = 0;

const box = document.getElementById("message");

function showMessage(){

    if(current >= messages.length) return;

    box.textContent = messages[current];

    if(messages[current] === "Te amo."){
        loveExplosion();
    }

    box.classList.remove("show-message");

    void box.offsetWidth;

    box.classList.add("show-message");

    current++;
}

function loveExplosion(){

    document
        .querySelectorAll(".star")
        .forEach(star => {
            star.classList.add("star-love");
        });

    setTimeout(() => {

    document
        .querySelectorAll(".star")
        .forEach(star => {
            star.classList.remove("star-love");
        });

    }, 3500);

}

let intervalId = setInterval(() => {

    bounceCount++;

    if(bounceCount === 1){
        showMessage();
        return;
    }

    if(
        bounceCount === 4 ||
        bounceCount === 7 ||
        bounceCount === 10 ||
        bounceCount === 13 ||
        bounceCount === 17
    ){
        showMessage();
    }

    if(bounceCount === 22){
        
        clearInterval(intervalId);
        
        const ball = document.querySelector('.ball');
        ball.style.animationPlayState = 'paused';
        
        const glow = document.querySelector('.glow');
        glow.classList.add('glow-stopped');
        
        const ballWrap = document.querySelector('.ball-wrap');
        ballWrap.classList.add('ball-wrap-stopped');

        // CREAR BOTONES
        const btn1 = document.createElement('div');
        btn1.className = 'menu-btn';
        btn1.id = 'btn-carta';

        const btn2 = document.createElement('div');
        btn2.className = 'menu-btn';
        btn2.id = 'btn-fotos';

        document.body.appendChild(btn1);
        document.body.appendChild(btn2);

        setTimeout(() => {
            btn1.classList.add('visible');
        }, 500);

        setTimeout(() => {
            btn2.classList.add('visible');
        }, 1200);
        
        // ASIGNAR EVENTO AL BOTÓN DE FOTOS (toggle)
btn2.onclick = function(){
    if(galleryOpen){
        closeGallery();
    } else {
        openGallery();
    }
};


    }

}, 2200);

const stars = document.getElementById("stars");

for(let i = 0; i < 120; i++){

    const star = document.createElement("div");

    star.classList.add("star");

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDuration =
        (Math.random() * 5 + 4) + "s";

    star.style.animationDelay =
        (Math.random() * 5) + "s";

    stars.appendChild(star);
}




let galleryOpen = false;

// ==================== GALERÍA ====================

const photos = [
    'adrian/img/gallery/image1.jpg',
    'adrian/img/gallery/image2.jpg',
    'adrian/img/gallery/image3.jpg',
    'adrian/img/gallery/image4.jpg',
    'adrian/img/gallery/image5.jpg',
    'adrian/img/gallery/image6.jpg',
    'adrian/img/gallery/image1.jpg',
    'adrian/img/gallery/image2.jpg',
    'adrian/img/gallery/image3.jpg',
    'adrian/img/gallery/image4.jpg',
    'adrian/img/gallery/image5.jpg',
    'adrian/img/gallery/image6.jpg',
    'adrian/img/gallery/image1.jpg',
    'adrian/img/gallery/image2.jpg',
    'adrian/img/gallery/image3.jpg',
    'adrian/img/gallery/image4.jpg',
    'adrian/img/gallery/image5.jpg',
    'adrian/img/gallery/image6.jpg',
    'adrian/img/gallery/image1.jpg',
    'adrian/img/gallery/image2.jpg'
];

function createGallery(){
    const existing = document.getElementById('gallery');
    if(existing) existing.remove();
    
    const gallery = document.createElement('div');
    gallery.id = 'gallery';
    gallery.style.display = 'none';
    
    photos.forEach((url) => {
        const photo = document.createElement('div');
        photo.classList.add('photo');
        photo.style.backgroundImage = `url(${url})`;
        
        const size = Math.random() * 20 + 25;
        photo.style.width = size + 'px';
        photo.style.height = size + 'px';
        
        photo.style.top = (Math.random() * 85 + 5) + '%';
        photo.style.left = (Math.random() * 85 + 5) + '%';
        
        photo.onclick = function(e){
            e.stopPropagation();
            closeGallery();
        };
        
        gallery.appendChild(photo);
    });
    
    document.body.appendChild(gallery);
}

function openGallery() {
    const ball = document.querySelector('.ball');
    const ballWrap = document.querySelector('.ball-wrap');
    const glow = document.querySelector('.glow');
    const scene = document.querySelector('.scene');
    
    document.body.classList.remove('gallery-closed');
    document.body.classList.add('gallery-open');
    
    ball.style.transition = 'all 0.3s ease';
    ball.style.transform = 'scale(0)';
    ball.style.opacity = '0';
    
    glow.style.transition = 'all 0.3s ease';
    glow.style.opacity = '0';
    
    scene.classList.add('hidden');
    
    // Si la galería no existe, crearla
    if(!document.getElementById('gallery')){
        createGallery();
    }
    
    setTimeout(() => {
        const gallery = document.getElementById('gallery');
        gallery.style.display = 'block';
        gallery.classList.add('visible');
    }, 400);
    
    galleryOpen = true;  // <-- AGREGAR ESTA LÍNEA
}

function closeGallery() {
    const gallery = document.getElementById('gallery');
    const ball = document.querySelector('.ball');
    const ballWrap = document.querySelector('.ball-wrap');
    const glow = document.querySelector('.glow');
    const scene = document.querySelector('.scene');
    
    // OCULTAR GALERÍA
    gallery.classList.remove('visible');
    
    // QUITAR ZOOM
    document.body.classList.remove('gallery-open');
    document.body.classList.add('gallery-closed');
    
    setTimeout(() => {
        gallery.style.display = 'none';
        
        // MOSTRAR PELOTA + HALO + SCENE
        scene.classList.remove('hidden');
        
        ball.style.transition = 'none';
        ball.style.transform = 'scale(1)';
        ball.style.opacity = '1';
        
        glow.style.opacity = '0.7';
        
        setTimeout(() => {
            ball.style.transition = 'transform 12s linear infinite';
        }, 100);
    }, 600);

    galleryOpen = false;
}


</script>
