<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title>Poemas de Héctor Samil Acosta | Torsacovas</title>
<meta name="description" content="Colección de poemas de Héctor Samil Acosta en Torsacovas. Explora versos sobre amor, soledad, memoria y reflexión en una selección de poesía contemporánea.">

<link rel="icon" href="assets/img/logo/torsacovas.ico">
<link rel="preload" href="/assets/img/menu/menu.png" as="image" fetchpriority="high">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages/poemas.css">

</head>

<body>

<div class="page-wrap">

  <div class="layout">
    <div id="header"></div>
    <div id="menu"></div>
  </div>

  <div class="crp">

    <h3>Poemas</h3>

    <button id="btn-filtros" class="btn-filtros">
      Buscar y filtrar poemas
    </button>

    <div class="contenedor-poemas">

      <div id="lista-poemas" class="poema"></div>
      <div id="preview-global" class="poema-preview"></div>

      <aside id="panel-filtros" class="panel-filtros">

        <h4>Buscar poemas</h4>

        <input 
          id="buscador-poemas"
          type="search"
          placeholder="Buscar por título, contenido o palabras clave..."
        >

        <h4>Temática</h4>

        <select id="filtro-tema">
          <option value="">Todas</option>
        </select>

        <h4>Año</h4>

        <select id="filtro-anio">
          <option value="">Todos</option>
        </select>

        <h4>Mes</h4>

        <select id="filtro-mes">
        
          <option value="">
          Todos
          </option>

          <option value="01">
          Enero
          </option>

          <option value="02">
          Febrero
          </option>

          <option value="03">
          Marzo
          </option>

          <option value="04">
          Abril
          </option>

          <option value="05">
          Mayo
          </option>

          <option value="06">
          Junio
          </option>

          <option value="07">
          Julio
          </option>

          <option value="08">
          Agosto
          </option>

          <option value="09">
          Septiembre
          </option>

          <option value="10">
          Octubre
          </option>

          <option value="11">
          Noviembre
          </option>

          <option value="12">
          Diciembre
          </option>

        </select>

        <h4>Ordenar</h4>

        <select id="orden-poemas">

          <option value="aleatorio">
            Aleatorio
          </option>

          <option value="reciente">
            Más recientes
          </option>

          <option value="antiguo">
            Más antiguos
          </option>

          <option value="likes">
            Más gustados
          </option>

          <option value="comentarios">
            Más comentados
          </option>

          <option value="az">
            A - Z
          </option>

          <option value="za">
            Z - A
          </option>

        </select>

        <div id="contador-poemas">
          0 poemas
        </div>

        <button id="limpiar-filtros" class="btn-limpiar-filtros">
            Quitar filtros
        </button>

      </aside>

    </div>

  </div>

  <div id="footer"></div>
  <div id="modal"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script type="module" src="assets/js/load-partials.js"></script>
<script src="assets/js/contact-form.js"></script>

<script type="module" src="/assets/js/pages/poemas/listado-poemas.js"></script>
<script type="module" src="/assets/js/pages/poemas/filtros-ui.js"></script>
<script type="module" src="/assets/js/pages/poemas/buscador-poemas.js"></script>
<script type="module" src="/assets/js/pages/poemas/filtros-poemas.js"></script>
<script type="module" src="/assets/js/pages/poemas/orden-poemas.js"></script>
<script type="module" src="/assets/js/pages/poemas/url-poemas.js"></script>

</body>
</html>
