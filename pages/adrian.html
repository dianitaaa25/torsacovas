<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelota de Fútbol</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

.scene{
    position:relative;
    width:500px;
    height:500px;
}

/* HALO */

.glow{
    position:absolute;
    left:50%;
    bottom:40px;

    width:260px;
    height:260px;

    transform:translateX(-50%);

    background:
    radial-gradient(
        circle,
        rgba(180,190,255,.55) 0%,
        rgba(120,130,255,.35) 25%,
        rgba(70,80,180,.18) 55%,
        rgba(20,20,80,.08) 80%,
        transparent 100%
    );

    filter:blur(25px);

    animation:glowPulse 1.5s ease-in-out infinite;
}

/* CONTENEDOR DEL REBOTE */

.ball-wrapper{
    position:absolute;
    left:50%;
    bottom:130px;

    transform:translateX(-50%);

    animation:bounce 1.5s ease-in-out infinite;
}

/* PELOTA */

.ball{
    width:170px;
    height:170px;

    animation:spin 10s linear infinite;
}

/* REBOTE */

@keyframes bounce{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0)
            scaleX(1.14)
            scaleY(.84);
    }

    12%{
        transform:
            translateX(-50%)
            translateY(-8px)
            scale(1);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-220px)
            scale(1);
    }

    88%{
        transform:
            translateX(-50%)
            translateY(-8px)
            scale(1);
    }
}

/* ROTACIÓN */

@keyframes spin{

    from{
        transform:rotate(-18deg);
    }

    to{
        transform:rotate(342deg);
    }
}

/* HALO DINÁMICO */

@keyframes glowPulse{

    0%,100%{
        transform:
            translateX(-50%)
            scale(1.4);

        opacity:.95;
    }

    50%{
        transform:
            translateX(-50%)
            scale(.55);

        opacity:.25;
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="glow"></div>

    <div class="ball-wrapper">

        <svg class="ball"
             viewBox="0 0 200 200"
             xmlns="http://www.w3.org/2000/svg">

            <defs>

                <radialGradient id="sphere"
                                cx="28%"
                                cy="18%"
                                r="85%">

                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="50%" stop-color="#f6f6f6"/>
                    <stop offset="100%" stop-color="#bcbcbc"/>

                </radialGradient>

                <clipPath id="clipBall">
                    <circle cx="100" cy="100" r="98"/>
                </clipPath>

            </defs>

            <!-- esfera -->

            <circle
                cx="100"
                cy="100"
                r="98"
                fill="url(#sphere)"
            />

            <!-- brillo -->

            <ellipse
                cx="62"
                cy="48"
                rx="40"
                ry="24"
                fill="white"
                opacity=".25"
            />

            <!-- textura inclinada -->

            <g clip-path="url(#clipBall)"
               transform="rotate(-20 100 100)">

                <!-- pentágono central -->

                <polygon
                    points="
                    100,65
                    125,82
                    116,112
                    84,112
                    75,82"
                    fill="#111"/>

                <!-- paneles alrededor -->

                <polygon
                    points="54,55 76,67 70,93 42,95 30,72"
                    fill="#111"/>

                <polygon
                    points="145,48 170,62 164,88 136,95 124,68"
                    fill="#111"/>

                <polygon
                    points="34,122 62,112 80,132 68,162 38,156"
                    fill="#111"/>

                <polygon
                    points="134,132 156,114 184,126 176,156 146,164"
                    fill="#111"/>

                <!-- líneas -->

                <g
                    fill="none"
                    stroke="#111"
                    stroke-width="4">

                    <path d="M76 67 L100 65"/>
                    <path d="M125 82 L145 48"/>
                    <path d="M116 112 L134 132"/>
                    <path d="M84 112 L62 112"/>
                    <path d="M75 82 L54 55"/>

                    <path d="M125 82 L170 62"/>
                    <path d="M116 112 L156 114"/>

                    <path d="M84 112 L34 122"/>
                    <path d="M75 82 L42 95"/>

                </g>

            </g>

            <!-- sombra de borde -->

            <circle
                cx="100"
                cy="100"
                r="98"
                fill="none"
                stroke="rgba(0,0,0,.25)"
                stroke-width="3"
            />

        </svg>

    </div>

</div>

</body>
</html>
